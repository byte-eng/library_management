<h4>Author Management</h4><br>

<div class="d-flex justify-content-between mb-3">
    <input type="text" class="form-control w-25" id="author-search" placeholder="Search Author ...">
    <button class="btn btn-primary" id="add-author-btn">Add Author</button>
</div>

<table class="table table-bordered">
    <thead>
        <tr>
            <th>Name</th>
            <th>Total Books</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody id="author-table"></tbody>
</table>

<div class="d-flex justify-content-center mt-3" id="author-pagination" style="bottom: 20px; z-index: 1050;"></div>

<div class="modal fade" id="addAuthorModal">
    <div class="modal-dialog">
        <div class="modal-content p-3">

            <form id="add-author-form">
                <h5>Add Author</h5>
                <input type="text" name="name" class="form-control mb-3" placeholder="Author Name" required>
                <button class="btn btn-success w-100">Save</button>
            </form>

        </div>
    </div>
</div>
