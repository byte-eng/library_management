<h4>Issue Management</h4><br>

<div class="d-flex justify-content-between mb-3">
    <input type="text" class="form-control w-25" id="issue-search" placeholder="Search by Name ...">
</div>

<table class="table table-bordered">
    <thead>
        <tr>
            <th>Student</th>
            <th>Book</th>
            <th>Status</th>
            <th>Issue Date</th>
            <th>Return Date</th>
            <th>Fine</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody id="issue-table"></tbody>
</table>

<div class="d-flex justify-content-center mt-3" id="issue-pagination" style="bottom: 20px; z-index: 1050;"></div>
