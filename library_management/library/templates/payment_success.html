{% extends 'base.html' %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">

    <div class="card shadow-lg text-center p-5" style="max-width: 500px; width: 100%; border-radius: 15px;">
        
        <div class="mb-4">
            <div style="font-size: 60px;">Payment Successful</div>
        </div>

        <h2 class="mb-3 text-success">Payment Successful</h2>

        <p class="text-muted mb-4">
            Your fine has been successfully paid.  
            Thank you for completing the payment.
        </p>

        <div class="d-grid gap-2">
            <a href="{% url 'student_dashboard' %}" class="btn btn-dark">
                Go to Dashboard
            </a>
        </div>

        <p class="text-muted mt-4" style="font-size: 14px;">
            Redirecting to dashboard in <span id="countdown">5</span> seconds...
        </p>

    </div>

</div>
{% endblock %}


{% block script %}
<script>
    let seconds = 5;
    const countdownEl = document.getElementById("countdown");

    const timer = setInterval(() => {
        seconds--;
        countdownEl.innerText = seconds;

        if (seconds <= 0) {
            clearInterval(timer);
            window.location.href = "{% url 'student_dashboard' %}";
        }
    }, 1000);
</script>
{% endblock %}
